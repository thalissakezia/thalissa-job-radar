name: Thalissa Job Radar

on:
  workflow_dispatch:
  schedule:
    # 08:00, 11:00 e 16:00 em Brasília (UTC-3)
    - cron: "0 11,14,19 * * *"

permissions:
  contents: write

concurrency:
  group: thalissa-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Varredura
        run: python run.py

      - name: Salvar histórico e relatório
        shell: bash
        run: |
          git config user.name "thalissa-job-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json reports/latest.md
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
          else
            git commit -m "chore: atualizar radar de vagas"
            git push
          fi
